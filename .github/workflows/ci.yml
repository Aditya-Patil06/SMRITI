name: SMRITI CI - Layer A & Layer B

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: smriti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest psycopg2-binary psycopg[binary] sentence-transformers alembic pgvector
        
    - name: Run Layer A Tests (SQLite)
      run: |
        pytest -q --ignore=tests/test_phase3_pgvector.py
        
    - name: Run Layer B Alembic Migrations
      env:
        DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/smriti_test"
      run: |
        alembic upgrade head

    - name: Run Layer B Tests (PostgreSQL + pgvector)
      env:
        SMRITI_PG_TESTS: "1"
        DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/smriti_test"
      run: |
        pytest tests/test_phase3_pgvector.py -v -s
